name: Build Zombie AI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: zombie-ai-minecraft-26.3
          path: build/libs/*.jar
